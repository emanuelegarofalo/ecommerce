spring:
  application:
    name: gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8181/realms/spring-microservices-security-realm
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: product-service
              uri: http://localhost:8080
              predicates:
                - Path=/products/**
              filters:
                - PrefixPath=/api
                - name: CircuitBreaker
                  args:
                    id: productServiceCircuitBreaker
                    fallbackUri: forward:/fallback

            - id: order-service
              uri: http://localhost:8081
              predicates:
                - Path=/orders/**
              filters:
                - PrefixPath=/api
                - name: CircuitBreaker
                  args:
                    id: orderServiceCircuitBreaker
                    fallbackUri: forward:/fallback

            - id: inventory-service
              uri: http://localhost:8082
              predicates:
                - Path=/inventory/**
              filters:
                - PrefixPath=/api
                - name: CircuitBreaker
                  args:
                    id: inventoryServiceCircuitBreaker
                    fallbackUri: forward:/fallback

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

resilience4j:
  circuitbreaker:
    configs:
        default:
            registerHealthIndicator: true
            sliding-window-type: COUNT_BASED
            slidingWindowSize: 10
            wait-duration-in-open-state: 5s
            permitted-number-of-calls-in-half-open-state: 3
            automatic-transition-from-open-to-half-open-enabled: true
            minimum-number-of-calls: 5
    instances:
      productServiceCircuitBreaker:
        base-config: default
      orderServiceCircuitBreaker:
        base-config: default
      inventoryServiceCircuitBreaker:
        base-config: default
  timelimiter:
    configs:
        default:
            timeout-duration: 3s
  retry:
    configs:
        default:
            max-attempts: 3
            wait-duration: 2s

server:
  port: 9000
  
  